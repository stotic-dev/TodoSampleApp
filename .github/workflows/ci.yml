name: CI

on:
  # 対象ブランチを限定しない（全ブランチ宛てのPRでCIを実行）
  pull_request:

# 同じPRで新しいpushがあったら古いジョブをキャンセルする
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Ktlint
        run: ./gradlew ktlintCheck -PktlintStrict=true

      - name: Lint
        run: ./gradlew lint

      - name: Unit test
        run: ./gradlew test

      - name: Build debug
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
