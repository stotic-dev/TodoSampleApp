name: CI

on:
  pull_request:
  # update-snapshots ワークフローが GITHUB_TOKEN で push した後に必須チェックを起動するため
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Setup Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Ktlint
        run: ./gradlew ktlintCheck

      - name: Run Reviewdog
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # KtlintのXMLレポートを探す
          REPORTS=$(find . -name "ktlint*.xml")

          # レポートが見つかった場合のみreviewdogを実行
          if [ -n "$REPORTS" ]; then
            cat $REPORTS | reviewdog -f=checkstyle -reporter=github-pr-review -level=warning
          else
            echo "No ktlint XML reports found."
          fi

      - name: Lint
        run: ./gradlew lint

      - name: Unit test
        run: ./gradlew test

      # ベースラインの更新は update-snapshots ワークフロー (PR に update-snapshots ラベル) で行う
      - name: Screenshot test (feature:*:ui)
        run: ./gradlew verifyRoborazziDebug

      - name: Build debug
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7
