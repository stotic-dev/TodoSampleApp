name: Update Snapshots

# PR に `update-snapshots` ラベルを付けると、CI と同じ環境 (ubuntu / JDK 17) で
# スナップショットのベースライン (feature/*/ui/src/test/screenshots/*.png) を記録し、
# PR ブランチにコミットする。ローカル環境との描画差分を避けるため、ベースライン更新はここでのみ行う。
on:
  pull_request:
    types: [labeled]

concurrency:
  group: update-snapshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  record:
    name: Record snapshots
    if: github.event.label.name == 'update-snapshots'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Record snapshots
        run: ./gradlew recordRoborazziDebug

      - name: Commit and push baselines
        id: commit
        run: |
          git add -A -- '**/src/test/screenshots/*.png'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "スナップショットのベースラインを更新 (CI)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label update-snapshots

      # GITHUB_TOKEN による push は新しいワークフローをトリガーしないため、
      # 必須ステータスチェック (Build & Test) を明示的に起動する
      - name: Trigger CI on the new commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.event.pull_request.head.ref }}"

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            body="📸 スナップショットのベースラインを更新しました (${{ steps.commit.outputs.sha }})。CI を再実行しています。"
          elif [ "${{ job.status }}" = "success" ]; then
            body="📸 スナップショットに変更はありませんでした。"
          else
            body="📸 スナップショットの記録に失敗しました。[ワークフローのログ](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) を確認してください。"
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body "$body"
